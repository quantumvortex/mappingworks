<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>mapping portfolio</title>
  <style>
    :root {
      --bg: #0f0f12; --card-bg: #18181d; --text: #eaeaea;
      --muted: #8b8b99; --ranked: #66ccff; --loved: #ff66ab; --accent: #7c5cff; --danger: #ff5c5c;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg); color: var(--text);
      font-family: system-ui, -apple-system, sans-serif;
      padding: 3rem 1.5rem; max-width: 1000px; margin: 0 auto;
    }
    header {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 2rem; border-bottom: 1px solid #26262e; padding-bottom: 1rem;
    }
    nav a { color: var(--muted); text-decoration: none; margin-left: 1.5rem; }
    nav a.active, nav a:hover { color: var(--text); }
    .subtitle { color: var(--muted); margin-bottom: 2rem; font-size: 0.95rem; }
    button {
      background: #24242c; color: var(--text); border: 1px solid #363642;
      padding: 0.45rem 0.9rem; border-radius: 6px; cursor: pointer; font-size: 0.85rem;
    }
    button:hover { border-color: var(--accent); }
    .grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 1.5rem;
    }
    .card {
      background: var(--card-bg); border-radius: 8px; overflow: hidden;
      border: 1px solid #24242c; cursor: pointer; transition: transform 0.2s, border-color 0.2s;
    }
    .card:hover { transform: translateY(-4px); border-color: #454554; }
    .card-banner { width: 100%; height: 110px; object-fit: cover; background: #222; }
    .card-body { padding: 1rem; }
    .song-title { font-weight: 600; margin-bottom: 0.4rem; line-height: 1.3; }
    .meta { display: flex; justify-content: space-between; align-items: center; font-size: 0.82rem; color: var(--muted); }
    .badge { font-weight: 700; font-size: 0.72rem; text-transform: uppercase; padding: 2px 6px; border-radius: 4px; }
    .badge.ranked { color: var(--ranked); background: rgba(102, 204, 255, 0.12); }
    .badge.loved { color: var(--loved); background: rgba(255, 102, 171, 0.12); }

    footer {
      margin-top: 4rem; padding-top: 1.5rem; border-top: 1px solid #26262e;
      display: flex; justify-content: space-between; color: var(--muted); font-size: 0.85rem;
    }
    .admin-trigger { background: none; border: none; color: var(--muted); cursor: pointer; padding: 0; }
    .admin-trigger:hover { color: var(--text); }

    /* Modals */
    dialog {
      background: var(--card-bg); color: var(--text); border: 1px solid #363642;
      border-radius: 10px; padding: 1.5rem; max-width: 660px; width: 94%; margin: auto;
    }
    #writeup-modal { padding: 0; overflow: hidden; }
    dialog::backdrop { background: rgba(0, 0, 0, 0.78); }

    /* Popup Top Banner Image */
    .modal-hero {
      position: relative; width: 100%; height: 185px; background: #121216;
    }
    .modal-hero img {
      width: 100%; height: 100%; object-fit: cover; display: block;
    }
    .modal-hero-overlay {
      position: absolute; inset: 0;
      background: linear-gradient(to top, var(--card-bg) 4%, rgba(24, 24, 29, 0.25) 65%, transparent 100%);
    }
    .modal-content { padding: 0.5rem 1.5rem 1.5rem; position: relative; }

    .form-group { margin-bottom: 0.85rem; }
    .form-group label { display: block; font-size: 0.82rem; color: var(--muted); margin-bottom: 0.3rem; }
    input, select, textarea {
      width: 100%; padding: 0.55rem; background: var(--bg); color: var(--text);
      border: 1px solid #2e2e38; border-radius: 5px; font-family: inherit;
    }
    textarea { min-height: 170px; resize: vertical; line-height: 1.5; }
    .modal-actions { display: flex; justify-content: space-between; align-items: center; margin-top: 1.2rem; }
    .right-actions { display: flex; gap: 0.6rem; }

    /* BBCode Editor Toolbar & Preview Tabs */
    .editor-header {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 0.4rem; flex-wrap: wrap; gap: 0.5rem;
    }
    .tab-group { display: flex; gap: 0.35rem; }
    .tab-btn {
      padding: 0.25rem 0.65rem; font-size: 0.78rem; border-radius: 4px;
      background: #141419; border: 1px solid #2e2e38; color: var(--muted);
    }
    .tab-btn.active {
      background: var(--accent); color: #fff; border-color: var(--accent);
    }
    .bbcode-toolbar {
      display: flex; flex-wrap: wrap; gap: 0.3rem; margin-bottom: 0.45rem;
      background: #131318; padding: 0.4rem; border-radius: 6px; border: 1px solid #2a2a34;
    }
    .tool-btn {
      padding: 0.22rem 0.5rem; font-size: 0.76rem; border-radius: 4px;
      background: #1e1e26; border: 1px solid #32323e; color: #d0d0dc;
    }
    .tool-btn:hover { background: #2a2a36; border-color: var(--accent); }
    .preview-box {
      display: none; min-height: 170px; max-height: 280px; overflow-y: auto;
      padding: 0.75rem; background: var(--bg); border: 1px solid #2e2e38; border-radius: 5px;
    }

    /* BBCode Rendered Styles */
    .writeup-text {
      line-height: 1.65; margin: 1.1rem 0; color: #d4d4e0;
      max-height: 55vh; overflow-y: auto; padding-right: 0.3rem;
      word-wrap: break-word;
    }
    .writeup-text h3 {
      color: var(--text); font-size: 1.1rem; margin: 1rem 0 0.4rem;
      border-bottom: 1px solid #2b2b36; padding-bottom: 0.25rem;
    }
    .writeup-text a { color: var(--ranked); text-decoration: none; }
    .writeup-text a:hover { text-decoration: underline; }
    .writeup-text img {
      max-width: 100%; height: auto; border-radius: 6px; margin: 0.6rem 0;
      border: 1px solid #2b2b36; display: block;
    }
    .writeup-text blockquote {
      border-left: 3px solid var(--accent); background: rgba(124, 92, 255, 0.08);
      padding: 0.6rem 0.9rem; margin: 0.6rem 0; border-radius: 0 6px 6px 0; color: #c4c4d4;
    }
    .writeup-text details {
      background: #131317; border: 1px solid #2b2b36; border-radius: 6px;
      padding: 0.5rem 0.8rem; margin: 0.6rem 0;
    }
    .writeup-text summary { cursor: pointer; font-weight: 600; color: var(--text); }
    .writeup-text code {
      background: #111115; padding: 0.15rem 0.4rem; border-radius: 4px;
      font-family: monospace; font-size: 0.88em; color: #ff9d76;
    }
  </style>
</head>
<body>

  <header>
    <h1>mapping</h1>
    <nav>
      <a href="#" class="active">mapping</a>
    </nav>
  </header>

  <p class="subtitle">Click a beatmap for write-ups and details.</p>
  <div id="map-grid" class="grid"></div>

  <footer>
    <span>© 2026</span>
    <button class="admin-trigger" onclick="openEditor(-1)">+ Admin</button>
  </footer>

  <!-- Write-up Viewer Modal with Header Image -->
  <dialog id="writeup-modal">
    <div class="modal-hero">
      <img id="view-banner" src="" alt="Map Banner" />
      <div class="modal-hero-overlay"></div>
    </div>
    <div class="modal-content">
      <h2 id="view-title"></h2>
      <p id="view-meta" style="color: var(--muted); font-size: 0.85rem; margin-top: 0.25rem;"></p>
      <div id="view-body" class="writeup-text"></div>
      <div class="modal-actions">
        <button id="edit-this-btn" type="button">Edit Entry</button>
        <div class="right-actions">
          <a id="view-osu-link" href="#" target="_blank" rel="noopener"><button type="button">osu! Beatmap ↗</button></a>
          <button onclick="document.getElementById('writeup-modal').close()">Close</button>
        </div>
      </div>
    </div>
  </dialog>

  <!-- In-Site Admin Editor Modal -->
  <dialog id="admin-modal">
    <h3 id="editor-heading" style="margin-bottom: 1rem;">Add Beatmap</h3>
    <div class="form-group">
      <label>GitHub Personal Access Token (Saved locally in your browser)</label>
      <input type="password" id="gh-token" placeholder="github_pat_..." />
    </div>
    <div class="form-group" style="display: flex; gap: 0.5rem;">
      <div style="flex: 1;">
        <label>Artist</label>
        <input type="text" id="map-artist" placeholder="e.g., Camellia" />
      </div>
      <div style="flex: 1;">
        <label>Song Title</label>
        <input type="text" id="map-title" placeholder="e.g., Chirality" />
      </div>
    </div>
    <div class="form-group" style="display: flex; gap: 0.5rem;">
      <div style="flex: 1;">
        <label>osu! Beatmapset ID</label>
        <input type="text" id="map-id" placeholder="e.g., 2150000" />
      </div>
      <div style="flex: 1;">
        <label>Date Mapped</label>
        <input type="text" id="map-date" placeholder="21 April 2026" />
      </div>
      <div style="width: 140px;">
        <label>Status</label>
        <select id="map-status">
          <option value="">Unranked</option>
          <option value="Ranked">Ranked</option>
          <option value="Loved">Loved</option>
        </select>
      </div>
    </div>
    <div class="form-group">
      <label>Custom Header Image URL (Optional — defaults to osu! beatmap cover if left blank)</label>
      <input type="text" id="map-banner" placeholder="https://..." />
    </div>

    <!-- Write-up Editor with Toolbar & Live Preview -->
    <div class="form-group">
      <div class="editor-header">
        <label style="margin: 0;">Map Write-up (BBCode)</label>
        <div class="tab-group">
          <button type="button" id="tab-write" class="tab-btn active" onclick="switchEditorTab('write')">Write</button>
          <button type="button" id="tab-preview" class="tab-btn" onclick="switchEditorTab('preview')">Live Preview</button>
        </div>
      </div>

      <div id="bbcode-toolbar" class="bbcode-toolbar">
        <button type="button" class="tool-btn" onclick="insertBB('[b]', '[/b]')" title="Bold"><b>B</b></button>
        <button type="button" class="tool-btn" onclick="insertBB('[i]', '[/i]')" title="Italic"><i>I</i></button>
        <button type="button" class="tool-btn" onclick="insertBB('[u]', '[/u]')" title="Underline"><u>U</u></button>
        <button type="button" class="tool-btn" onclick="insertBB('[s]', '[/s]')" title="Strikethrough"><s>S</s></button>
        <button type="button" class="tool-btn" onclick="insertBB('[heading]', '[/heading]')" title="Section Heading">H</button>
        <button type="button" class="tool-btn" onclick="insertBB('[color=#66ccff]', '[/color]')" title="Text Color">Color</button>
        <button type="button" class="tool-btn" onclick="insertBB('[size=130]', '[/size]')" title="Text Size">Size</button>
        <button type="button" class="tool-btn" onclick="insertBB('[centre]', '[/centre]')" title="Center Align">Center</button>
        <button type="button" class="tool-btn" onclick="insertBB('[url=https://]', '[/url]')" title="Insert Link">Link</button>
        <button type="button" class="tool-btn" onclick="insertBB('[img]', '[/img]')" title="Embed Image">Image</button>
        <button type="button" class="tool-btn" onclick="insertBB('[quote]', '[/quote]')" title="Quote Block">Quote</button>
        <button type="button" class="tool-btn" onclick="insertBB('[box=Section Title]', '[/box]')" title="Collapsible Box">Box</button>
        <button type="button" class="tool-btn" onclick="insertBB('[code]', '[/code]')" title="Inline Code">Code</button>
      </div>

      <textarea id="map-writeup" placeholder="[heading]Concept[/heading]&#10;Write your thoughts using [b]BBCode[/b]..."></textarea>
      <div id="editor-preview" class="preview-box writeup-text" style="margin: 0;"></div>
    </div>

    <div class="modal-actions">
      <button id="delete-btn" onclick="deleteMap()" style="background: var(--danger); border: none; display: none;">Delete</button>
      <div class="right-actions" style="margin-left: auto;">
        <button onclick="document.getElementById('admin-modal').close()">Cancel</button>
        <button id="save-btn" onclick="saveChanges()" style="background: var(--accent); border: none;">Publish</button>
      </div>
    </div>
  </dialog>

  <script>
    // --- REPLACE THESE TWO LINES WITH YOUR GITHUB DETAILS ---
    const GITHUB_USER = "quantumvortex";
    const GITHUB_REPO = "mappingworks";

    let maps = [];
    let editingIndex = -1;

    document.getElementById('gh-token').value = localStorage.getItem('gh_token') || '';

    // Close modals when clicking the dark backdrop outside the box
    document.querySelectorAll('dialog').forEach(modal => {
      modal.addEventListener('click', (e) => {
        if (e.target === modal) modal.close();
      });
    });

    // Keyboard shortcut: Ctrl + Shift + E to open editor
    window.addEventListener('keydown', (e) => {
      if (e.ctrlKey && e.shiftKey && e.key.toLowerCase() === 'e') {
        e.preventDefault();
        openEditor(-1);
      }
    });

    // Insert BBCode tags around selected text in textarea
    function insertBB(openTag, closeTag) {
      const textarea = document.getElementById('map-writeup');
      const start = textarea.selectionStart;
      const end = textarea.selectionEnd;
      const text = textarea.value;
      const selected = text.substring(start, end);

      textarea.value = text.substring(0, start) + openTag + selected + closeTag + text.substring(end);
      textarea.focus();

      // Place cursor inside tags if nothing was highlighted, or after if text was wrapped
      const cursorPosition = selected.length > 0 ? start + openTag.length + selected.length + closeTag.length : start + openTag.length;
      textarea.setSelectionRange(cursorPosition, cursorPosition);
    }

    // Toggle between Write mode and Live BBCode Preview mode
    function switchEditorTab(mode) {
      const textarea = document.getElementById('map-writeup');
      const toolbar = document.getElementById('bbcode-toolbar');
      const preview = document.getElementById('editor-preview');
      const tabWrite = document.getElementById('tab-write');
      const tabPreview = document.getElementById('tab-preview');

      if (mode === 'preview') {
        preview.innerHTML = parseBBCode(textarea.value);
        textarea.style.display = 'none';
        toolbar.style.display = 'none';
        preview.style.display = 'block';
        tabWrite.classList.remove('active');
        tabPreview.classList.add('active');
      } else {
        textarea.style.display = 'block';
        toolbar.style.display = 'flex';
        preview.style.display = 'none';
        tabPreview.classList.remove('active');
        tabWrite.classList.add('active');
      }
    }

    // Safe BBCode-to-HTML Parser (osu! style)
    function parseBBCode(text) {
      if (!text) return "<em>No write-up added yet.</em>";

      let html = text
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;");

      const rules = [
        [/[b]([\s\S]*?)\[\/b\]/gi, '<strong>$1</strong>'],
        [/[i]([\s\S]*?)\[\/i\]/gi, '<em>$1</em>'],
        [/[u]([\s\S]*?)\[\/u\]/gi, '<u>$1</u>'],
        [/[s]([\s\S]*?)\[\/s\]/gi, '<s>$1</s>'],
        [/\[heading\]([\s\S]*?)\[\/heading\]/gi, '<h3>$1</h3>'],
        [/\[heading\]([^\n\r]*)/gi, '<h3>$1</h3>'],
        [/[center]([\s\S]*?)\[\/center\]/gi, '<div style="text-align:center">$1</div>'],
        [/[centre]([\s\S]*?)\[\/centre\]/gi, '<div style="text-align:center">$1</div>'],
        [/\[color=([^\]]+)\]([\s\S]*?)\[\/color\]/gi, '<span style="color:$1">$2</span>'],
        [/\[size=(\d+)\]([\s\S]*?)\[\/size\]/gi, '<span style="font-size:$1%">$2</span>'],
        [/\[url=(https?:\/\/[^\]]+)\]([\s\S]*?)\[\/url\]/gi, '<a href="$1" target="_blank" rel="noopener">$2</a>'],
        [/[url](https?:\/\/[\s\S]*?)\[\/url\]/gi, '<a href="$1" target="_blank" rel="noopener">$1</a>'],
        [/[img](https?:\/\/[\s\S]*?)\[\/img\]/gi, '<img src="$1" alt="Write-up image" loading="lazy" />'],
        [/[quote]([\s\S]*?)\[\/quote\]/gi, '<blockquote>$1</blockquote>'],
        [/\[quote=([^\]]+)\]([\s\S]*?)\[\/quote\]/gi, '<blockquote><strong>$1 wrote:</strong><br>$2</blockquote>'],
        [/\[box=([^\]]+)\]([\s\S]*?)\[\/box\]/gi, '<details><summary>$1</summary><div style="margin-top:0.5rem">$2</div></details>'],
        [/[spoilerbox]([\s\S]*?)\[\/spoilerbox\]/gi, '<details><summary>Spoiler</summary><div style="margin-top:0.5rem">$1</div></details>'],
        [/[code]([\s\S]*?)\[\/code\]/gi, '<code>$1</code>']
      ];

      for (let pass = 0; pass < 3; pass++) {
        rules.forEach(([regex, replacement]) => {
          html = html.replace(regex, replacement);
        });
      }

      return html
        .replace(/\n/g, '<br>')
        .replace(/(<\/h3>|<\/blockquote>|<\/details>|<\/div>)<br>/gi, '$1');
    }

    async function loadMaps() {
      try {
        const res = await fetch('./maps.json?t=' + Date.now());
        maps = await res.json();
        renderGrid();
      } catch (err) {
        console.error("Failed to load maps.json:", err);
      }
    }

    function renderGrid() {
      const grid = document.getElementById('map-grid');
      grid.innerHTML = maps.map((map, index) => {
        const cover = map.bannerUrl || `https://assets.ppy.sh/beatmaps/${map.beatmapsetId}/covers/cover.jpg`;
        const badgeClass = map.status ? map.status.toLowerCase() : '';
        return `
          <div class="card" onclick="openWriteup(${index})">
            <img class="card-banner" src="${cover}" alt="${map.title}" loading="lazy" />
            <div class="card-body">
              <div class="song-title">${map.artist} - ${map.title}</div>
              <div class="meta">
                <span>Mapped ${map.date}</span>
                ${map.status ? `<span class="badge ${badgeClass}">${map.status}</span>` : ''}
              </div>
            </div>
          </div>
        `;
      }).join('');
    }

    function openWriteup(index) {
      const map = maps[index];
      const highResCover = map.bannerUrl || `https://assets.ppy.sh/beatmaps/${map.beatmapsetId}/covers/cover@2x.jpg`;
      
      const bannerImg = document.getElementById('view-banner');
      bannerImg.src = highResCover;
      bannerImg.onerror = () => {
        bannerImg.src = `https://assets.ppy.sh/beatmaps/${map.beatmapsetId}/covers/cover.jpg`;
      };

      document.getElementById('view-title').textContent = `${map.artist} - ${map.title}`;
      document.getElementById('view-meta').textContent = `Mapped ${map.date} ${map.status ? '• ' + map.status : ''}`;
      document.getElementById('view-body').innerHTML = parseBBCode(map.writeup);
      document.getElementById('view-osu-link').href = `https://osu.ppy.sh/beatmapsets/${map.beatmapsetId}`;
      document.getElementById('edit-this-btn').onclick = () => {
        document.getElementById('writeup-modal').close();
        openEditor(index);
      };
      document.getElementById('writeup-modal').showModal();
    }

    function openEditor(index) {
      editingIndex = index;
      const isEdit = index >= 0;
      document.getElementById('editor-heading').textContent = isEdit ? "Edit Beatmap" : "Add New Beatmap";
      document.getElementById('delete-btn').style.display = isEdit ? "block" : "none";

      const map = isEdit ? maps[index] : { artist: "", title: "", beatmapsetId: "", bannerUrl: "", date: "", status: "", writeup: "" };
      document.getElementById('map-artist').value = map.artist || "";
      document.getElementById('map-title').value = map.title || "";
      document.getElementById('map-id').value = map.beatmapsetId || "";
      document.getElementById('map-banner').value = map.bannerUrl || "";
      document.getElementById('map-date').value = map.date || "";
      document.getElementById('map-status').value = map.status || "";
      document.getElementById('map-writeup').value = map.writeup || "";

      switchEditorTab('write');
      document.getElementById('admin-modal').showModal();
    }

    async function commitToGitHub(updatedMaps, commitMessage) {
      const token = document.getElementById('gh-token').value.trim();
      if (!token) return alert("Please enter your GitHub Personal Access Token.");
      localStorage.setItem('gh_token', token);

      const btn = document.getElementById('save-btn');
      btn.textContent = "Saving...";
      btn.disabled = true;

      const apiUrl = `https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents/maps.json`;
      const headers = {
        "Authorization": `Bearer ${token}`,
        "Accept": "application/vnd.github+json"
      };

      try {
        const getRes = await fetch(apiUrl, { headers, cache: "no-store" });
        if (!getRes.ok) throw new Error("Could not fetch maps.json from GitHub. Check your username/repo/token.");
        const fileData = await getRes.json();

        const jsonString = JSON.stringify(updatedMaps, null, 2);
        const bytes = new TextEncoder().encode(jsonString);
        const binString = Array.from(bytes, (b) => String.fromCodePoint(b)).join("");
        const base64Content = btoa(binString);

        const putRes = await fetch(apiUrl, {
          method: "PUT",
          headers,
          body: JSON.stringify({
            message: commitMessage,
            content: base64Content,
            sha: fileData.sha
          })
        });

        if (!putRes.ok) throw new Error("Failed to commit changes. Make sure your token has Read & Write Contents permission.");

        maps = updatedMaps;
        renderGrid();
        document.getElementById('admin-modal').close();
      } catch (err) {
        alert(err.message);
      } finally {
        btn.textContent = "Publish";
        btn.disabled = false;
      }
    }

    function saveChanges() {
      const entry = {
        artist: document.getElementById('map-artist').value.trim(),
        title: document.getElementById('map-title').value.trim(),
        beatmapsetId: document.getElementById('map-id').value.trim(),
        bannerUrl: document.getElementById('map-banner').value.trim(),
        date: document.getElementById('map-date').value.trim(),
        status: document.getElementById('map-status').value,
        writeup: document.getElementById('map-writeup').value
      };

      const updatedMaps = [...maps];
      if (editingIndex >= 0) {
        updatedMaps[editingIndex] = entry;
      } else {
        updatedMaps.unshift(entry);
      }

      commitToGitHub(updatedMaps, `Update map: ${entry.artist} - ${entry.title}`);
    }

    function deleteMap() {
      if (editingIndex < 0 || !confirm("Delete this beatmap from your portfolio?")) return;
      const removed = maps[editingIndex];
      const updatedMaps = maps.filter((_, i) => i !== editingIndex);
      commitToGitHub(updatedMaps, `Delete map: ${removed.artist} - ${removed.title}`);
    }

    loadMaps();
  </script>
</body>
</html>
